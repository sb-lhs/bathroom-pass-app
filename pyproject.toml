[project]
name = "hallpass-qt"
version = "0.2.4"
description = "Native Touchscreen Bathroom & Water Pass System (PySide6/Qt Quick)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "basedpyright>=1.20"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
